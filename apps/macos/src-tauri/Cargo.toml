[package]
name = "qualiapp_macos"
version = "0.1.0"
description = "QualiApp macOS desktop track"
authors = ["QualiApp"]
edition = "2021"

[lib]
name = "qualiapp_macos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "qualiapp_macos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
